[workspace]
members = ["crates/pf-catalog", "crates/pf-shell-core", "crates/pf-shell"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
pf-scene = { git = "https://github.com/pocketforge-os/runtime.git", rev = "2bbae0e3e016b595afa2ec65b7b2579d6e9ae60b" }
pf-ports = { git = "https://github.com/pocketforge-os/runtime.git", rev = "2bbae0e3e016b595afa2ec65b7b2579d6e9ae60b" }
pf-render = { git = "https://github.com/pocketforge-os/runtime.git", rev = "2bbae0e3e016b595afa2ec65b7b2579d6e9ae60b" }
pf-framehost = { git = "https://github.com/pocketforge-os/runtime.git", rev = "2bbae0e3e016b595afa2ec65b7b2579d6e9ae60b" }
pf-theme = { git = "https://github.com/pocketforge-os/runtime.git", rev = "2bbae0e3e016b595afa2ec65b7b2579d6e9ae60b" }
pf-input-map = { git = "https://github.com/pocketforge-os/runtime.git", rev = "2bbae0e3e016b595afa2ec65b7b2579d6e9ae60b" }
