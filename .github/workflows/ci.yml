name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Add Rust components
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install Wayland keyboard dependency
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo test -p pf-shell --features wayland --locked
      - run: cargo clippy -p pf-shell --features wayland --all-targets -- -D warnings
