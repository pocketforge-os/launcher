name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Add Rust components
        run: rustup component add rustfmt clippy
      - name: Enforce raise-only mockup-diff ratchets
        run: |
          python3 -m unittest scripts/tests/test_check_mockup_ratchet.py
          python3 scripts/check-mockup-ratchet.py
      - run: cargo fmt --all -- --check
      - run: cargo run -p design-token-codegen --locked -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Score offscreen routes against approved design renders
        run: cargo test -p pf-shell --test mockup_diff --locked -- --nocapture
      - name: Ensure cargo-nextest is on PATH (idempotent; no-op once the VM toolset provides it)
        run: |
          # Prefer a runner-resident cargo-nextest (installed by the rust-ci-toolset
          # drop-in on the pf-builder VM — pocketforge-automation). This guarded install
          # is a self-heal for a runner that predates that toolset change; it downloads a
          # prebuilt binary (~seconds) only when nextest is absent, then is a no-op every
          # run thereafter because ~/.cargo/bin persists on the self-hosted runner.
          command -v cargo-nextest >/dev/null 2>&1 || \
            curl -LsSf https://get.nexte.st/0.9.143/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          cargo nextest --version
      - name: Test workspace (nextest — global parallel pool across all test binaries)
        run: |
          echo "runner cores: nproc=$(nproc) nproc-all=$(nproc --all)"
          cargo nextest run --workspace --locked
      - name: Doc-tests (nextest does not run doc-tests; keep them from silently dropping)
        run: cargo test --workspace --locked --doc
      - name: Soak desktop launch and return against real authority
        run: ./scripts/desktop-sim-soak.sh
      - run: cargo build -p pf-shell --features wayland --locked
      - run: cargo test -p pf-shell --bin pf-shell --features wayland --locked wayland_
      - run: cargo clippy -p pf-shell --features wayland --all-targets -- -D warnings
