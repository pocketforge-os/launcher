[workspace]
members = ["crates/pf-catalog", "crates/pf-shell-core", "crates/pf-shell"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
pf-scene = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-ports = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-render = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-framehost = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-framehost-wayland = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-theme = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-input-map = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-prefs = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-prefs-port = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-session-client = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-session-authority = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
pf-wire = { git = "https://github.com/pocketforge-os/runtime.git", rev = "0296f1116dc24057a0c8c253bc19afcfb59aa810" }
