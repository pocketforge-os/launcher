[workspace]
members = [
  "crates/pf-catalog",
  "crates/pf-shell-core",
  "crates/pf-shell",
  "tools/design-token-codegen",
  "tools/fidelity-audit",
  "tools/pf-input-feed",
  "tools/taffy-spike",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
pf-scene = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-ports = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-render = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-framehost = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-framehost-wayland = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-theme = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-input-map = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-prefs = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-prefs-port = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-session-client = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-session-authority = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
pf-wire = { git = "https://github.com/pocketforge-os/runtime.git", rev = "ba8ccc962b264227490162ef07a9eaf6d334f9b8" }
taffy = { version = "=0.7.7", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }

# Offscreen evidence renders are CPU-bound software rasterization. In dev,
# optimize only the crates that own the raster, font, PNG, and ink-guard loops.
[profile.dev.package.pf-shell]
opt-level = 3

[profile.dev.package.pf-shell-core]
opt-level = 3

[profile.dev.package.pf-render]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

# Integration tests compile pf-shell itself as the root target, which package
# overrides cannot affect, so the raster-heavy test gate needs an optimized root.
[profile.test]
opt-level = 3
