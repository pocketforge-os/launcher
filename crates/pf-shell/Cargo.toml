[package]
name = "pf-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
evdev = "0.13.2"
libc = "0.2.175"
pf-app-manifest.workspace = true
pf-catalog = { path = "../pf-catalog" }
pf-shell-core = { path = "../pf-shell-core" }
pf-framehost.workspace = true
pf-framehost-wayland = { workspace = true, optional = true }
pf-input-map.workspace = true
pf-prefs.workspace = true
pf-prefs-port.workspace = true
pf-render.workspace = true
pf-ports.workspace = true
pf-scene.workspace = true
pf-theme.workspace = true
pf-session-client.workspace = true
pf-session-authority.workspace = true
pf-wire.workspace = true
png = "0.17.16"
serde_json = "1.0.143"
sha2 = "0.10.9"
signal-hook = "0.3.18"
rustix = { version = "1.1.4", features = ["event", "param", "time"] }
toml = "0.8.23"

[features]
desktop-sim = []
wayland = ["dep:pf-framehost-wayland", "pf-framehost-wayland/keyboard"]

[dev-dependencies]
# Keep the vendored runtime closure complete for pf-session-authority's dev-dependency.
pf-app-launch.workspace = true
# Keep the vendored runtime closure complete for pf-app-manifest's dev-dependency.
pocketforge.workspace = true
tempfile = "3.21.0"
# Hermetic stub compositor for the pf-shell wayland_* contract tests; pins match
# the runtime crate's own compositor_contract test harness.
wayland-server = "=0.31.10"
wayland-protocols = { version = "=0.32.9", features = ["server"] }

[lints]
workspace = true
