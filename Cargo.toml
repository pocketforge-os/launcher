[workspace]
members = [
  "crates/pf-catalog",
  "crates/pf-shell-core",
  "crates/pf-shell",
  "tools/design-token-codegen",
  "tools/taffy-spike",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
pf-scene = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-ports = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-render = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-framehost = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-framehost-wayland = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-theme = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-input-map = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-prefs = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-prefs-port = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-session-client = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-session-authority = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
pf-wire = { git = "https://github.com/pocketforge-os/runtime.git", rev = "81c1b807005f1c1399ec3b7be8db89dc5e498bd6" }
taffy = { version = "=0.7.7", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
