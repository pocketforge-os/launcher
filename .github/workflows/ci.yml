name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 60
    # Single source of the cargo-nextest pin within this repo (the install AND the
    # assert below both read it). It must match NEXTEST_VERSION in pocketforge-automation
    # scripts/install-rust-ci-toolset.sh — bump both together (cross-repo; they cannot
    # share a file). The assert step fails loudly if the runner ever runs a different
    # version than this pin.
    env:
      NEXTEST_VERSION: "0.9.143"
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Add Rust components
        run: rustup component add rustfmt clippy
      - name: Enforce raise-only mockup-diff ratchets
        run: |
          python3 -m unittest scripts/tests/test_check_mockup_ratchet.py
          python3 scripts/check-mockup-ratchet.py
      - run: cargo fmt --all -- --check
      - run: cargo run -p design-token-codegen --locked -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Score offscreen routes against approved design renders
        run: cargo test -p pf-shell --test mockup_diff --locked -- --nocapture
      - name: Fidelity-audit report (per-component, non-gating)
        # REPORT MODE — the whole-route scorer above is coarse; this enumerates
        # per-component structural + perceptual divergences (tsp-op5a.389). It is
        # deliberately non-gating: the gate flips on in the follow-up sweep bead
        # once the first ledger is triaged into baseline/accepted.json.
        continue-on-error: true
        run: |
          cargo build -p pf-shell --locked
          cargo run -p fidelity-audit --locked -- --shell-bin target/debug/pf-shell --format table
      - name: Ensure the PINNED cargo-nextest is on PATH (assert exact version)
        run: |
          # The pf-builder VM toolset (pocketforge-automation install-rust-ci-toolset.sh)
          # is meant to provide cargo-nextest resident. This step is the self-heal AND the
          # guard: it (re)installs the pinned prebuilt when the present version differs, and
          # then ASSERTS the exact pin — a stale runner binary must never survive silently.
          need="$NEXTEST_VERSION"
          have="$(cargo-nextest nextest --version 2>/dev/null | awk 'NR==1{print $2}' || true)"
          if [ "$have" != "$need" ]; then
            echo "cargo-nextest $need not on PATH (found: ${have:-none}); installing pinned prebuilt"
            curl -LsSf "https://get.nexte.st/$need/linux" | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
            have="$(cargo-nextest nextest --version 2>/dev/null | awk 'NR==1{print $2}' || true)"
          fi
          if [ "$have" != "$need" ]; then
            echo "::error::cargo-nextest version mismatch: found '${have:-none}', expected '$need'. A stale runner binary is shadowing the pin — re-provision the runner with pocketforge-automation scripts/install-rust-ci-toolset.sh --target runner (it installs cargo-nextest $need into the runner's ~/.cargo/bin)."
            exit 1
          fi
          echo "cargo-nextest $have (pinned) on PATH"
      - name: Test workspace (nextest — global parallel pool across all test binaries)
        run: cargo nextest run --workspace --locked
      - name: Doc-tests (nextest does not run doc-tests; keep them from silently dropping)
        run: cargo test --workspace --locked --doc
      - name: Soak desktop launch and return against real authority
        run: ./scripts/desktop-sim-soak.sh
      - run: cargo build -p pf-shell --features wayland --locked
      - run: cargo test -p pf-shell --bin pf-shell --features wayland --locked wayland_
      - run: cargo clippy -p pf-shell --features wayland --all-targets -- -D warnings
