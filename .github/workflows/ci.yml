name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Add Rust components
        run: rustup component add rustfmt clippy
      - name: Enforce raise-only mockup-diff ratchets
        run: |
          python3 -m unittest scripts/tests/test_check_mockup_ratchet.py
          python3 scripts/check-mockup-ratchet.py
      - run: cargo fmt --all -- --check
      - run: cargo run -p design-token-codegen --locked -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Score offscreen routes against approved design renders
        run: cargo test -p pf-shell --test mockup_diff --locked -- --nocapture
      - run: cargo test --workspace --locked
      - name: Soak desktop launch and return against real authority
        run: ./scripts/desktop-sim-soak.sh
      - name: Install Wayland keyboard dependency
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo test -p pf-shell --features wayland --locked
      - run: cargo clippy -p pf-shell --features wayland --all-targets -- -D warnings
